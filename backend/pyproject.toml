[project]
name = "emotioniq-backend"
version = "0.1.0"
description = "Local FastAPI backend for EmotionIQ"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "pillow>=11.0,<13.0",
    "httpx>=0.28,<1.0",
    "huggingface-hub>=0.28.0,<1.0",
    "aiohttp>=3.9.0,<4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
